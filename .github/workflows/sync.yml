name: Sync Bioconductor Builds

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - backfill
      limit:
        description: 'Limit for backfill (optional)'
        required: false
        type: number

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check if data branch exists
        id: check-data-branch
        run: |
          if git ls-remote --exit-code --heads origin data; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout existing data branch
        if: steps.check-data-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Create new data branch
        if: steps.check-data-branch.outputs.exists == 'false'
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data-branch
          cd data-branch
          git checkout --orphan data
          git rm -rf .
          echo "# Bioconductor Build Data" > README.md
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Initialize data branch"
          git push origin data

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run sync
        if: github.event.inputs.command != 'backfill'
        run: uv run bioc-tracker sync --data-dir ./data-branch

      - name: Run backfill
        if: github.event.inputs.command == 'backfill'
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          uv run bioc-tracker backfill --data-dir ./data-branch $LIMIT_ARG

      - name: Commit and push changes
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Sync Bioconductor builds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin data
          else
            echo "No changes to commit"
          fi
