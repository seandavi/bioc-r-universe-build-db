[project]
name = "bioc-build-tracker"
version = "0.1.0"
description = "Track and store Bioconductor R-Universe builds over time"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "universal-pathlib>=0.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "click>=8.0",
    "feedparser>=6.0",
    "tenacity>=8.0",
]

[project.scripts]
bioc-tracker = "bioc_build_tracker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioc_build_tracker"]
